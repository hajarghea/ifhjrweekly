<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Data Mahasiswa</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background: #f4f7fb;
        padding: 30px;
        color: #333;
    }

    h1, h2, h3{
        margin-bottom: 15px;
        color: #0f172a;
    }

    hr{
        margin: 20px 0;
        border: none;
        height: 2px;
        background: #dbeafe;
    }

    /* NAVBAR */
    .navbar{
        border-collapse: collapse;
        margin-bottom: 20px;
        overflow: hidden;
        border-radius: 10px;
    }

    .navbar td{
        background: #2563eb;
        transition: 0.3s;
    }

    .navbar td:hover{
        background: #1d4ed8;
    }

    .navbar a{
        color: white;
        text-decoration: none;
        padding: 12px 20px;
        display: block;
        font-weight: bold;
    }

    /* CARD */
    .card{
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        margin-top: 20px;
    }

    /* IMAGE */
    img{
        border-radius: 10px;
        margin: 10px 0;
    }

    /* TABLE */
    table{
        border-collapse: collapse;
    }

    th{
        background: #2563eb;
        color: white;
    }

    th, td{
        padding: 12px;
        border: 1px solid #d1d5db;
    }

    tr:nth-child(even){
        background: #f9fafb;
    }

    /* BUTTON */
    button{
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
        font-weight: bold;
    }

    button:hover{
        background: #1d4ed8;
    }

    /* FORM */
    input{
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
    }

    input:focus{
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 5px rgba(37,99,235,0.4);
    }

    form table{
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    ul{
        margin-left: 20px;
        margin-top: 10px;
    }

    p{
        margin-top: 10px;
        line-height: 1.7;
    }

    input:not([type="radio"]):not([type="checkbox"]){
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
    }

    input[type="radio"],
    input[type="checkbox"]{
        width: auto;
        margin-right: 5px;
    }
</style>
</head>
<body>
    <h2>Tambah Data Mahasiswa</h2>
    <form action="mahasiswa.html" method="post">
        <table class cellpadding="5px">
            <tr>
                <td><label for="nama">Nama</label></td>
                <td>:</td>
                <td><input type="text" id="nama" name="name"/></td>
            </tr>
            <tr>
                <td><label for="foto">Foto</label></td>
                <td>:</td>
                <td><input type="file" id="" name="foto"/></td>
            </tr>
            <tr>
                <td><label for="uts">UTS</label></td>
                <td>:</td>
                <td><input type="number" id="uts" name="uts"/></td>
            </tr>
            <tr>
                <td><label for="uas">UAS</label></td>
                <td>:</td>
                <td><input type="number" id="uas" name="uas"/></td>
            </tr>
             <tr>
                <td><label for="tugas">TUGAS</label></td>
                <td>:</td>
                <td><input type="number" id="tugas" name="tugas"/></td>
            </tr>
            <tr>
                <td colspan="3">
                    <button type="submit" name="submit">Tambah</button>
                </td>
            </tr>
        </table>
    </form>
    <br>
    <hr>

    <form action="">
        <table class cellpadding="5px">
            <tr>
                <td><label for="nama">Nama</label></td>
                <td>:</td>
                <td><input type="text" id="nama" name="name"/></td>
            </tr>
             <tr>
                <td><label for="nim">Nim</label></td>
                <td>:</td>
                <td><input type="number" id="nim" name="nim"/></td>
            </tr>
             <tr>
                <td><label for="password">Password</label></td>
                <td>:</td>
                <td><input type="password" id="password" name="password"/></td>
            </tr>
             <tr>
                <td><label for="email">Email</label></td>
                <td>:</td>
                <td><input type="email" id="email" name="email"/></td>
            </tr>
             <tr>
                <td><label for="no_hp">No HP</label></td>
                <td>:</td>
                <td><input type="tel" id="no_hp" name="no_hp"/></td>
            </tr>
             <tr>
                <td><label for="website_pribadi">Website pribadi</label></td>
                <td>:</td>
                <td><input type="url" id="website_pribadi" name="website_pribadi"/></td>
            </tr>
             <tr>
                <td><label for="tgl_lahir">Tanggal Lahir</label></td>
                <td>:</td>
                <td><input type="date" id="tgl_lahir" name="tgl_lahir"/></td>
            </tr>
             <tr>
                <td><label for="warna">Warna Favorit</label></td>
                <td>:</td>
                <td><input type="color" id="warna" name="warna"/></td>
            </tr> 
            <tr>
                <td><label for="tingkat_kepuasan">Tingkat kepuasan</label></td>
                <td>:</td>
                <td><input type="range" id="tingkat_kepuasan" name="tingkat_kepuasan"/></td>
            </tr>
            <tr>
                <td><label>Jenis kelamin</label></td>
                <td>:</td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-laki"/>
                    <label for="laki">Laki-laki</label>

                    <input type="radio" id="perempuan" name="jk" value="Perempuan">
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td><label>Hobi</label></td>
                <td>:</td>
                <td>
                    <input type="checkbox" id="tenis" name="hobi"/>
                    <label for="tenis">Tenis</label>

                    <input type="checkbox" id="futsal" name="hobi"/>
                    <label for="futsal">Futsal</label>

                    <input type="checkbox" id="basket" name="hobi"/>
                     <label for="basket">Basket</label>
                </td>
            </tr>
            <tr>
                <td><label for="foto">Upload Foto</label></td>
                <td>:</td>
                <td><input type="file" id="" name="foto"/></td>
            </tr>
            <tr>
                <td><label for="alamat">Alamat</label></td>
                <td>:</td>
                <td><input type="textarea" id="alamat" name="alamat"/></td>
            </tr>
            <tr>
                <td><label for="jurusan">Jurusan</label></td>
                <td>:</td>
                <td><input type="select option" id="jurusan" name="jurusan"/></td>
            </tr>
            <tr>
                <td colspan="3">
                    <button type="submit" name="submit">Tambah</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
