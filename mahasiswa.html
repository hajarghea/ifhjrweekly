<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mahasiswa | Informatika 2026</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background: #f4f7fb;
        padding: 30px;
        color: #333;
    }

    h1, h2, h3{
        margin-bottom: 15px;
        color: #0f172a;
    }

    hr{
        margin: 20px 0;
        border: none;
        height: 2px;
        background: #dbeafe;
    }

    /* NAVBAR */
    .navbar{
        border-collapse: collapse;
        margin-bottom: 20px;
        overflow: hidden;
        border-radius: 10px;
    }

    .navbar td{
        background: #2563eb;
        transition: 0.3s;
    }

    .navbar td:hover{
        background: #1d4ed8;
    }

    .navbar a{
        color: white;
        text-decoration: none;
        padding: 12px 20px;
        display: block;
        font-weight: bold;
    }

    /* CARD */
    .card{
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        margin-top: 20px;
    }

    /* IMAGE */
    img{
        border-radius: 10px;
        margin: 10px 0;
    }

    /* TABLE */
    table{
        border-collapse: collapse;
    }

    th{
        background: #2563eb;
        color: white;
    }

    th, td{
        padding: 12px;
        border: 1px solid #d1d5db;
    }

    tr:nth-child(even){
        background: #f9fafb;
    }

    /* BUTTON */
    button{
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
        font-weight: bold;
    }

    button:hover{
        background: #1d4ed8;
    }

    /* FORM */
    input{
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
    }

    input:focus{
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 5px rgba(37,99,235,0.4);
    }

    form table{
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    ul{
        margin-left: 20px;
        margin-top: 10px;
    }

    p{
        margin-top: 10px;
        line-height: 1.7;
    }
</style>
</head>
